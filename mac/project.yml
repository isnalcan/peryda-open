name: PerydaMac
options:
  bundleIdPrefix: com.isnalcan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PerydaKit:
    path: PerydaKit
targets:
  PerydaMac:
    type: application
    platform: macOS
    sources:
      - path: PerydaMac
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: PerydaKit
    info:
      path: PerydaMac/Info.plist
      properties:
        # Open PDF and EPUB files from Finder ("Open With → Peryda") without taking over as default.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
        CFBundleLocalizations: [tr, en, de, es]
        CFBundleDevelopmentRegion: en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnalcan.peryda.mac
        PRODUCT_NAME: Peryda
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Peryda
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: PerydaMac/PerydaMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Local development builds are signed to run on this Mac only; release signing comes later.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  PerydaMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PerydaMac
        excludes:
          - "**/*.entitlements"
          - "App/PerydaMacApp.swift"
          - "Resources/**"
      - path: PerydaMacTests
    dependencies:
      - package: PerydaKit
    info:
      path: PerydaMac/Info.plist
      properties:
        # Open PDF and EPUB files from Finder ("Open With → Peryda") without taking over as default.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
        CFBundleLocalizations: [tr, en, de, es]
        CFBundleDevelopmentRegion: en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnalcan.peryda.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
        # Tests run without the app: no window ever appears on screen.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  PerydaMacTests:
    build:
      targets:
        PerydaMacTests: [test]
    test:
      targets:
        - PerydaMacTests
