name: PerydaMac
options:
  bundleIdPrefix: com.isnalcan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PerydaKit:
    path: PerydaKit
targets:
  PerydaMac:
    type: application
    platform: macOS
    sources:
      - path: PerydaMac
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: PerydaKit
        product: PerydaKit
      # Sparkle (updates), pinned in PerydaKit/Package.swift; not linked into the tests.
      - package: PerydaKit
        product: PerydaUpdater
    info:
      path: PerydaMac/Info.plist
      properties:
        # Open PDF and EPUB files from Finder ("Open With → Peryda") without taking over as default.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
        CFBundleLocalizations: [tr, en, de, es]
        CFBundleDevelopmentRegion: en
        # Updates (Sparkle). With no SUEnableAutomaticChecks here, the reader is asked before the first
        # automatic check. The feed is the latest GitHub release (PERYDA_UPDATE_FEED_URL); only updates
        # signed with Peryda's update key (its public half below, in PERYDA_UPDATE_PUBLIC_KEY) are installed.
        SUFeedURL: $(PERYDA_UPDATE_FEED_URL)
        SUPublicEDKey: $(PERYDA_UPDATE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        # The feed itself is signed too, and an update is checked before it is unpacked: a forged feed
        # cannot offer an old (genuinely signed) version as a new one.
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        # YES only in update-rehearsal builds: then (and only then) the app accepts this Mac's own
        # http://127.0.0.1 feed. A release build never does (audit MA-5).
        PerydaUpdateRehearsal: $(PERYDA_UPDATE_REHEARSAL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnalcan.peryda.mac
        PRODUCT_NAME: Peryda
        # Raise both for every release: Sparkle compares the build number (CURRENT_PROJECT_VERSION).
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # Public half of the update signing key (mac/scripts/update-keys.sh). Empty: no update check.
        PERYDA_UPDATE_PUBLIC_KEY: "Q+rvhmfx5+vfeL6D7XS+sQaQC0NT5cdop49CyYa6v80="
        # Where the app looks for updates. Only scripts/update-rehearsal.sh changes it (to this Mac's own
        # 127.0.0.1); release.sh refuses to ship any other feed.
        PERYDA_UPDATE_FEED_URL: https://github.com/isnalcan/peryda-open/releases/latest/download/appcast.xml
        # Set to YES by scripts/update-rehearsal.sh only.
        PERYDA_UPDATE_REHEARSAL: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Peryda
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: PerydaMac/PerydaMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Local development builds are signed to run on this Mac only; release signing comes later.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  PerydaMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PerydaMac
        excludes:
          - "**/*.entitlements"
          - "App/PerydaMacApp.swift"
          - "App/SparkleUpdates.swift"
          - "Resources/**"
      - path: PerydaMacTests
    dependencies:
      - package: PerydaKit
    info:
      path: PerydaMac/Info.plist
      properties:
        # Open PDF and EPUB files from Finder ("Open With → Peryda") without taking over as default.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
        CFBundleLocalizations: [tr, en, de, es]
        CFBundleDevelopmentRegion: en
        # Updates (Sparkle). With no SUEnableAutomaticChecks here, the reader is asked before the first
        # automatic check. The feed is the latest GitHub release (PERYDA_UPDATE_FEED_URL); only updates
        # signed with Peryda's update key (its public half below, in PERYDA_UPDATE_PUBLIC_KEY) are installed.
        SUFeedURL: $(PERYDA_UPDATE_FEED_URL)
        SUPublicEDKey: $(PERYDA_UPDATE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        # The feed itself is signed too, and an update is checked before it is unpacked: a forged feed
        # cannot offer an old (genuinely signed) version as a new one.
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        # YES only in update-rehearsal builds: then (and only then) the app accepts this Mac's own
        # http://127.0.0.1 feed. A release build never does (audit MA-5).
        PerydaUpdateRehearsal: $(PERYDA_UPDATE_REHEARSAL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnalcan.peryda.mac.tests
        PERYDA_UPDATE_FEED_URL: https://github.com/isnalcan/peryda-open/releases/latest/download/appcast.xml
        PERYDA_UPDATE_REHEARSAL: NO
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
        # Tests run without the app: no window ever appears on screen.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  PerydaMacTests:
    build:
      targets:
        PerydaMacTests: [test]
    test:
      targets:
        - PerydaMacTests
