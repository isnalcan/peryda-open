[package]
name = "peryda-windows"
version = "0.1.1"
description = "Peryda for Windows"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "peryda_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.14.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
